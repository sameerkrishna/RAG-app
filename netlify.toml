[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "zip"
  directory = "netlify/functions"
  node_version = "18"

# Include server folder and google_credentials in function bundle
[functions."api"]
  included_files = ["server/**/*", "google_credentials/**/*"]

# Block access to sensitive files
[[redirects]]
  from = "/google_credentials/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*.env"
  to = "/404.html"
  status = 404

# API routes - proxy to serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Static assets - serve directly
[[redirects]]
  from = "/seed_documents/*"
  to = "/seed_documents/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# SPA fallback - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
